name: Oraculo daily sync
on:
  schedule:
    - cron: '20 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gerar agente.json (Asana) e noticias.json (RSS)
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
        run: node scripts/sync.js
      - name: Commit e push se mudou
        run: |
          git config user.name "Oraculo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add agente.json noticias.json
          git diff --staged --quiet || git commit -m "chore: sync diario [skip ci]"
          git push
